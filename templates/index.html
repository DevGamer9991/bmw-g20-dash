<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Dashboard</title>
    <script src="./socket.io.js"></script>
    <style>

        @font-face {
            font-family: 'Inter';
            src:url('fonts/Inter_18pt-Medium.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        html {
            cursor: none;
        }
        body {
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            cursor: none;
        }

        .gauge-wrap {
            width: 80vw;
            max-width: 900px;
        }

        .label {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin-bottom: 8px;
            color: #ddd;
        }

        .bar {
            position: relative;
            width: 100%;
            height: 30px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(255,255,255,0.08);
        }

        .fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #4db6ff, #7ad7ff);
            transition: width 0.08s linear;
        }

        .redline {
            position: absolute;
            left: 80%;
            top: 0;
            width: 4px;
            height: 100%;
            background: #ff3b30;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.9);
        }

        .ticks {
            position: relative;
            width: 100%;
            height: 18px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div style="width: 480px; height: 320px; position: relative; background: black; overflow: hidden">
        <div style="width: 196px; height: 145px; left: 264px; top: 27px; position: absolute; background: #595959; border-radius: 21px"></div>
        <div style="width: 165px; height: 36px; left: 279px; top: 32px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: white; font-size: 20px; font-family: Inter; font-weight: 400; word-wrap: break-word">Intake Air Temp</div>
        <div style="width: 165px; height: 80px; left: 279px; top: 72px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: #00FF2B; font-size: 40px; font-family: Inter; font-weight: 400; word-wrap: break-word" id="iatValue">130°</div>
        <div style="width: 196px; height: 88px; left: 19px; top: 205px; position: absolute; background: #595959; border-radius: 21px"></div>
        <div style="width: 165px; height: 21.85px; left: 34px; top: 208.03px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: white; font-size: 20px; font-family: Inter; font-weight: 400; word-wrap: break-word">RPM</div>
        <div style="width: 165px; height: 48.55px; left: 34px; top: 232.31px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: #00FF2B; font-size: 40px; font-family: Inter; font-weight: 400; word-wrap: break-word" id="rpmValue">3000</div>
        <div style="width: 196px; height: 88px; left: 264px; top: 205px; position: absolute; background: #595959; border-radius: 21px"></div>
        <div style="width: 165px; height: 21.85px; left: 279px; top: 208.03px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: white; font-size: 20px; font-family: Inter; font-weight: 400; word-wrap: break-word">AFR</div>
        <div style="width: 165px; height: 48.55px; left: 279px; top: 232.31px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: #00FF2B; font-size: 40px; font-family: Inter; font-weight: 400; word-wrap: break-word" id="afrValue">14.56</div>
        <div style="width: 196px; height: 145px; left: 19px; top: 27px; position: absolute; background: #595959; border-radius: 21px"></div>
        <div style="width: 165px; height: 36px; left: 34px; top: 32px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: white; font-size: 20px; font-family: Inter; font-weight: 400; word-wrap: break-word">Boost Pressure</div>
        <div style="width: 165px; height: 80px; left: 34px; top: 72px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: #00FF2B; font-size: 40px; font-family: Inter; font-weight: 400; word-wrap: break-word" id="boostValue">24 psi</div>
    </div>

    <script>
        // var fill = document.getElementById('rpmFill');
        var rpmValue = document.getElementById('rpmValue');

        var boostValue = document.getElementById('boostValue');

        function updateRPM(rpm) {
            var min = 0;
            var max = 8000;
            var clamped = Math.max(min, Math.min(max, rpm));
            var pct = (clamped / max) * 100;

            // fill.style.width = pct + '%';
            rpmValue.textContent = Math.round(clamped) + '';
        }

        function updateBoost(boost) {
            //var min = 0;
            //var max = 30; // Assuming max boost is 30 psi
            //var clamped = Math.max(min, Math.min(max, boost));
            boostValue.textContent = boost + " psi";

            if (boost >= 14) {
                boostValue.style.color = "#00FF2B";
            }
            else if (boost >=15 && boost <= 19) {
                boostValue.style.color = "orange";
            }
            else if(boost >= 20) {
                boostValue.style.color = "red";
            }
        }

        function updateIAT(iat) {
            //var min = 0;
            //var max = 30; // Assuming max boost is 30 psi
            //var clamped = Math.max(min, Math.min(max, boost));
            iatValue.textContent = iat + " °F";

            //if (boost >= 14) {
            //    boostValue.style.color = "#00FF2B";
            //}
            //else if (boost >=15 && boost <= 19) {
            //    boostValue.style.color = "orange";
            //}
            //else if(boost >= 20) {
            //    boostValue.style.color = "red";
            //}
        }

        var socket = io();
        socket.on('car_data', function(msg) {
            updateRPM(msg.rpm);
            updateBoost(msg.boost_pressure);
            updateIAT(msg.intake_air_temp)
            console.log(msg.rpm);
            console.log(msg.boost_pressure);
        });

        updateRPM(0);
        updateBoost(0);
        updateIAT(0);
    </script>
</body>
</html>
