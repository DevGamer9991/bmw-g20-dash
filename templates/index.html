<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Dashboard</title>
    <script src="./socket.io.js"></script>
    <style>
        body {
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .gauge-wrap {
            width: 80vw;
            max-width: 900px;
        }

        .label {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin-bottom: 8px;
            color: #ddd;
        }

        .bar {
            position: relative;
            width: 100%;
            height: 30px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(255,255,255,0.08);
        }

        .fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #4db6ff, #7ad7ff);
            transition: width 0.08s linear;
        }

        .redline {
            position: absolute;
            left: 80%;
            top: 0;
            width: 4px;
            height: 100%;
            background: #ff3b30;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.9);
        }

        .ticks {
            position: relative;
            width: 100%;
            height: 18px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="gauge-wrap">
        <div class="label">
            <span>Engine RPM</span>
            <span id="rpmValue">0 RPM</span>
        </div>

        <div class="bar">
            <div id="rpmFill" class="fill"></div>
            <div class="redline"></div>
        </div>

        <div class="ticks">
            <span>0</span>
            <span>2000</span>
            <span>4000</span>
            <span>6000</span>
            <span>7000</span>
        </div>
    </div>

    <script>
        var fill = document.getElementById('rpmFill');
        var rpmValue = document.getElementById('rpmValue');

        function updateRPM(rpm) {
            var min = 0;
            var max = 8000;
            var clamped = Math.max(min, Math.min(max, rpm));
            var pct = (clamped / max) * 100;

            fill.style.width = pct + '%';
            rpmValue.textContent = Math.round(clamped) + ' RPM';
        }

        var socket = io();
        socket.on('rpm_data', function(msg) {
            updateRPM(msg.rpm);
            console.log(msg.rpm);
        });

        updateRPM(6500);
    </script>
</body>
</html>
