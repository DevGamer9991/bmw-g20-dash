<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Dashboard</title>
    <script src="/socket.io.js"></script>
    <script src="/dashboard.js"></script>
    <script src="/menu.js"></script>
    <style>

        @font-face {
            font-family: 'Michroma';
            src:url('/files/Michroma-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        html {
            cursor: none;
        }
        body {
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            cursor: none;
        }
    </style>
</head>
<body>
    <div style="width: 800px; height: 480px; position: relative; background: black; overflow: hidden">
        <div style="width: 330.28px; height: 61px; left: 70px; top: 89px; position: absolute; color: #FFEE00; font-size: 20px; font-family: Michroma; font-weight: 400; word-wrap: break-word">Boost Pressure</div>
        <div style="width: 299.12px; height: 84px; left: 429.88px; top: 78px; position: absolute; text-align: right; justify-content: center; display: flex; flex-direction: column; color: #FFEE00; font-size: 36px; font-family: Michroma; font-weight: 400; word-wrap: break-word" id="boostValue">000 psi</div>
        <div style="width: 98.24px; height: 95px; left: 71px; top: 306px; position: absolute; color: #FFEE00; font-size: 20px; font-family: Michroma; font-weight: 400; word-wrap: break-word">RPM</div>
        <div style="width: 185px; height: 64px; left: 70px; top: 337px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: #FFEE00; font-size: 40px; font-family: Michroma; font-weight: 400; word-wrap: break-word" id="rpmValue">0000</div>
        <div style="width: 98.24px; height: 95px; left: 569px; top: 306px; position: absolute; color: #FFEE00; font-size: 20px; font-family: Michroma; font-weight: 400; word-wrap: break-word">IAT</div>
        <div style="width: 161px; left: 568px; top: 344px; position: absolute; text-align: right; justify-content: center; display: flex; flex-direction: column; color: #FFEE00; font-size: 36px; font-family: Michroma; font-weight: 400; word-wrap: break-word" id="iatValue">000°</div>
    </div>

    <script>
        var dashboard = window.BmwDashboard();
    </script>
</body>
</html>
